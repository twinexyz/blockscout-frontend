name: Build and Deploy

on:
 push:
   branches:
     - '**'  # This will trigger on all branches
   tags:
     - '**'  # This will trigger on all tags
 pull_request:



concurrency:
 group: ${{ github.workflow }}-${{ github.ref }}
 cancel-in-progress: true

env:
  BRANCH: ${{ github.ref_name }}
  REPO: ${{ github.event.repository.name }}
  ORG: ${{ github.repository_owner }}

jobs:
  build_and_push:
    name: Build Image (${{ matrix.target }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        target: ${{ fromJSON(inputs.docker_targets) }}
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Aggressive Manual Cleanup
        run: |
          # 1. Prune Docker build cache (crucial for Docker heavy workflows)
          # This removes unused containers, networks, images (dangling and unreferenced)
          sudo docker system prune -a --force
          # 2. Remove SDKs and tools unnecessary for most projects
          # Customize this list based on what your project DOES NOT need
          echo "Removing unneeded SDKs..."
          sudo rm -rf /usr/share/dotnet  # .NET SDKs (often ~1.5 GB)
          sudo rm -rf /usr/local/lib/android # Android SDK (often ~6 GB)
          sudo rm -rf /usr/lib/jvm          # Java JDKs
          sudo rm -rf /usr/local/.ghcup     # Haskell
          sudo rm -rf /usr/share/swift      # Swift
          sudo rm -rf /opt/hostedtoolcache  # Tool cache (if you don't use CodeQL, etc.)
          # 3. Show remaining space for debugging
          df -h

      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Sanitize branch slug
        id: sanitize
        run: |
          CLEAN_BRANCH="${{ inputs.branch_slug }}"
          BRANCH="${CLEAN_BRANCH//\//-}"
          echo "CLEAN_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_ACTION_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Cache Docker layers
        uses: actions/cache@v4.2.4
        with:
          path: ${{ runner.temp }}/.buildx-cache-${{ matrix.arch }}
          key: ${{ runner.os }}-buildx-${{ github.sha }}-${{ matrix.arch }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.arch }}-

      - name: Build and push ${{ matrix.arch }} image
        id: build
        uses: docker/build-push-action@v6.18.0
        env:
          BRANCH: ${{ env.CLEAN_BRANCH }}
        with:
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }},${{ env.REGISTRY_IMAGE }}
          target: ${{ matrix.target }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name=${{ env.REGISTRY_IMAGE }},push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4.3.6
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Handle build failure
        if: ${{ failure() }}
        run: echo "Build failed. Check logs for details."

      - name: End timer and calculate duration
        id: set-duration
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ env.start_time }}))
          echo "duration=${duration}" >> $GITHUB_OUTPUT


  merge:
    runs-on: ubuntu-latest
    needs:
      - build_arch
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_ACTION_ACTOR }}
          password: ${{ secrets.GH_ACTION_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Sanitize branch slug
        id: sanitize
        run: |
          CLEAN_BRANCH="${{ inputs.branch_slug }}"
          BRANCH="${CLEAN_BRANCH//\//-}"
          echo "CLEAN_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5.8.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            #type=ref,event=branch
            #type=ref,event=pr
            type=raw,value=${{ env.BRANCH }}-${{ env.SHA }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
        env:
          BRANCH: ${{ env.CLEAN_BRANCH }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}


  deploy:
    name: Deploy Latest Tag
    runs-on: ubuntu-24.04
    needs: ["build_and_push", "merge"]
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: step-security/harden-runner@446798f8213ac2e75931c1b0769676d927801858 # v2.10.3
        with:
          egress-policy: audit
      - name: Checkout tools repo
        uses: actions/checkout@v4
        with:
          repository: twinexyz/argocd
          path: argocd
          token: ${{ secrets.GH_ACTION_PAT  }}
      - name: Update Tag in Helm Values for argocd
        run: |
            ls -al
            cd argocd/apps/values/${{ env.REPO }}/staging &&  sed -i "/tag:/s/tag:.*/tag: ${{ env.BRANCH }}-${GITHUB_SHA}/" frontend.yaml
            git config --global user.email "devops@twinelabs.xyz"
            git config --global user.name "pen-pal"
            git add .
            git commit --allow-empty -m "updated image tag to ${GITHUB_SHA} for ${{ env.REPO }}"
            git push origin main

